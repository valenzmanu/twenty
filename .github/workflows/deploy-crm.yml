name: Deploy CRM

on:
  push:
    branches:
      - instabloom/self-host
    paths:
      - "deploy/instabloom/twenty-crm/**"
      - ".github/workflows/deploy-crm.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host crm_vps
            HostName $VPS_HOST
            User ${VPS_USER:-manuel}
            Port ${VPS_PORT:-2222}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ServerAliveInterval 20
            ServerAliveCountMax 3
          EOF

      - name: Deploy to VPS
        env:
          DEPLOY_TARGET: crm_vps
          REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR || '/home/manuel/apps/twenty-crm' }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://crm.instabloom.gt/healthz' }}
        run: deploy/instabloom/twenty-crm/scripts/deploy-vps.sh
